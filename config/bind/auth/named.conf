// Authoritative server for example.lab and noglue.lab  10.10.1.12
options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    dnssec-validation no;
    minimal-responses no;
    pid-file none;
};
controls { };

zone "example.lab" {
    type primary;
    file "/etc/bind-lab/db.example.lab";
};

zone "noglue.lab" {
    type primary;
    file "/etc/bind-lab/db.noglue.lab";
};
