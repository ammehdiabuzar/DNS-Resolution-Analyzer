// Root server  a.root-servers.lab  10.10.1.10
options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    dnssec-validation no;
    minimal-responses no;
    pid-file none;
};
controls { };

zone "." {
    type primary;
    file "/etc/bind-lab/db.root";
};
