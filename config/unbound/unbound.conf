# Recursive resolver 10.10.4.10 - serves Do53 (53), DoT (853) and DoH (443).
# It resolves through the lab hierarchy: root hints point to 10.10.1.10.
server:
    verbosity: 1
    use-syslog: no
    logfile: ""
    username: ""
    chroot: ""
    directory: "/etc/unbound-lab"
    pidfile: ""

    interface: 0.0.0.0@53
    interface: 0.0.0.0@853
    interface: 0.0.0.0@443
    do-ip6: no
    access-control: 10.10.0.0/16 allow
    access-control: 127.0.0.0/8 allow

    # TLS for DoT (853) and DoH (443, HTTP/2 at /dns-query)
    tls-service-key: "/certs/server.key"
    tls-service-pem: "/certs/server.pem"
    tls-port: 853
    https-port: 443
    http-endpoint: "/dns-query"
    http-notls-downstream: no

    # Private lab hierarchy: no DNSSEC validation, our own root hints.
    module-config: "iterator"
    root-hints: "/etc/unbound-lab/root.hints"
    harden-glue: yes
    qname-minimisation: no
    prefetch: no
    # Keep idle DoT/DoH connections open long enough for repeat-query tests.
    tcp-idle-timeout: 60000
    incoming-num-tcp: 64

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-use-cert: no
